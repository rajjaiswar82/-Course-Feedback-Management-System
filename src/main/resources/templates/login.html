<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Course Feedback</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div class="panel" style="max-width: 480px; width: 100%; padding: 60px 50px;">
        
        <!-- Logo/Brand -->
        <div style="text-align: center; margin-bottom: 40px;">
            <div class="brand" style="font-size: 2.5rem; margin-bottom: 12px;">Course Feedback</div>
            <p class="muted" style="font-size: 1rem;">Sign in to manage feedback</p>
        </div>

        <!-- Error Message -->
        <div th:if="${param.error}" class="error" style="background: var(--danger); color: var(--danger-dark); padding: 16px; border-radius: var(--radius); margin-bottom: 24px; border: 2px solid var(--danger-dark);">
            ⚠ Invalid username or password
        </div>

        <!-- Logout Message -->
        <div th:if="${param.logout}" class="success" style="margin-bottom: 24px;">
            ✓ You have been logged out successfully
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input 
                    id="username" 
                    type="text" 
                    name="username" 
                    required 
                    autofocus
                    placeholder="Enter your username"
                    style="font-size: 1.05rem;">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input 
                    id="password" 
                    type="password" 
                    name="password" 
                    required
                    placeholder="Enter your password"
                    style="font-size: 1.05rem;">
            </div>

            <button type="submit" class="button" style="width: 100%; margin-top: 12px; padding: 18px;">
                Sign In
            </button>
        </form>

        <!-- Demo Credentials -->
        <div style="margin-top: 40px; padding-top: 32px; border-top: 2px dashed var(--line);">
            <p style="text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; font-weight: 600;">
                Demo Credentials
            </p>
            
            <div style="display: grid; gap: 12px;">
                <div style="background: var(--background-alt); padding: 14px; border-radius: var(--radius); border-left: 4px solid var(--brand);">
                    <div style="font-weight: 700; color: var(--brand); font-size: 0.85rem; margin-bottom: 6px;">👤 STUDENT</div>
                    <div style="font-family: 'Courier New', monospace; font-size: 0.9rem; color: var(--ink-light);">
                        <div>Username: <strong>student</strong></div>
                        <div>Password: <strong>Student@123</strong></div>
                    </div>
                </div>

                <div style="background: var(--background-alt); padding: 14px; border-radius: var(--radius); border-left: 4px solid #8b5cf6;">
                    <div style="font-weight: 700; color: #8b5cf6; font-size: 0.85rem; margin-bottom: 6px;">👨‍💼 ADMIN</div>
                    <div style="font-family: 'Courier New', monospace; font-size: 0.9rem; color: var(--ink-light);">
                        <div>Username: <strong>admin</strong></div>
                        <div>Password: <strong>Admin@123</strong></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Help Text -->
        <p style="text-align: center; margin-top: 32px; color: var(--muted-light); font-size: 0.85rem;">
            For demo purposes only • Task 15 Final Release
        </p>
    </div>
</div>
</body>
</html>
