spring.application.name=course-feedback-management-system
server.port=8080

# Simple local profile: H2 in-memory database; data resets on restart.
spring.datasource.url=jdbc:h2:mem:coursefeedback;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
