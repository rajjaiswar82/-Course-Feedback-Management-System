version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: course-feedback-db
    environment:
      POSTGRES_DB: coursefeedback
      POSTGRES_USER: feedbackuser
      POSTGRES_PASSWORD: feedbackpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - feedback-network

  app:
    image: rajjaiswar/course-feedback:${VERSION:-latest}
    container_name: feedback-app
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/coursefeedback
      - SPRING_DATASOURCE_USERNAME=feedbackuser
      - SPRING_DATASOURCE_PASSWORD=feedbackpass
    volumes:
      - ./src/main/resources/static:/app/resources/static:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - feedback-network

volumes:
  postgres_data:

networks:
  feedback-network:
    driver: bridge
