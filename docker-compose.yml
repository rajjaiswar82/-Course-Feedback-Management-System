# Docker Compose for Course Feedback Management System
# Task 14: Provisioning and Rollback Demonstration
# Version-controlled deployment

version: '3.8'

services:
  feedback-app:
    image: rajjaiswar/course-feedback:${APP_VERSION:-1.0.30}
    container_name: feedback-app
    ports:
      - "8082:8080"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - JAVA_OPTS=${JAVA_OPTS:--Xms256m -Xmx512m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    labels:
      - "app.name=course-feedback"
      - "app.version=${APP_VERSION:-1.0.30}"
      - "app.environment=${APP_ENV:-dev}"
      - "managed-by=task-14-provisioning"

networks:
  default:
    name: course-feedback-network
